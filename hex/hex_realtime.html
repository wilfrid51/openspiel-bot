<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Real-time Hex Board Visualization</title>
    <link rel="stylesheet" href="hexreplay.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      #status {
        padding: 10px;
        background: #f0f0f0;
        border-top: 1px solid #ccc;
        font-family: monospace;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }
      #status.connected {
        background: #d4edda;
      }
      #status.disconnected {
        background: #f8d7da;
      }
      #main {
        padding-bottom: 50px; /* Add padding to prevent content from being hidden behind status */
      }
    </style>
  </head>
  <body id="main">
    <div id="board-panel">
      <div id="button-panel">
        <div id="left-buttons">
          <button class="text-button" id="button-clear" type="button"
                  title="Clear">New board</button>
          Size: <input class="input" id="input-size" type="text"
                       title="Board size" size="3">
        </div>
        <div id="mid-buttons">
          <button class="button" id="button-rotate-left" type="button"
                  title="Rotate left"></button>
          <button class="button" id="button-rotate-right" type="button"
                  title="Rotate right"></button>
          <button class="button" id="button-numbered"
                  title="Show move numbers"></button>
          <div class="menu-container" id="menu-actions">
            <button class="button menu-toggle" id="button-menu"
                    title="More actions"></button>
            <div class="menu" title="">
              <div class="menu-item" id="item-swap">Swap</div>
              <div class="menu-item" id="item-pass">Pass</div>
              <div class="menu-item" id="item-resign">Resign</div>
              <div class="menu-divider"></div>
              <div class="menu-header">Colors:</div>
              <div class="menu-item indent" id="item-bw">Black and white</div>
              <div class="menu-item indent" id="item-rg">Red and blue</div>
              <div class="menu-divider"></div>
              <div class="menu-item" id="item-download">Download as SGF</div>
              <div class="menu-item" id="item-lg">Import from Little Golem</div>
              <div class="menu-divider"></div>
              <div class="menu-item" id="item-about">About</div>
            </div>
          </div>
        </div>
      </div>
      <div id="board-container">
      </div>
    </div>
    <div id="movelist-panel">
      <div id="movelist-controls">
        <button class="button" id="button-first" type="button"
                title="First (home)"></button>
        <button class="button" id="button-undo" type="button"
                title="Previous (left)"></button>
        <button class="button" id="button-redo" type="button"
                title="Next (right)"></button>
        <button class="button" id="button-last" type="button"
                title="Last (end)"></button>
      </div>
      <div id="movelist-container">
      </div>
    </div>
    <div id="status" class="disconnected">Connecting...</div>
    <script src="hexreplay.js"></script>
    <script>
      // Real-time update functionality
      let lastUpdateId = 0;
      let updateInterval = null;
      let previousBoard = null;
      let previousSize = null;
      
      function updateStatus(message, connected) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.className = connected ? 'connected' : 'disconnected';
      }
      
      function updateBoardFromState(state) {
        if (!state || !state.board) return;
        
        // Wait for hexreplay to be initialized
        if (!window.v) {
          console.log('Waiting for hexreplay to initialize...');
          return;
        }

        const size = state.size || 11;
        const board = state.board;
        
        // Check if this is a new game (size changed or board is empty/reset)
        const isNewGame = previousSize !== size || 
                         !previousBoard || 
                         (previousBoard && previousBoard.length === 0) ||
                         (board && board.every(row => row.every(cell => cell === '.')));
        
        // Check if board size changed
        if (window.v.o && (window.v.o.files !== size || window.v.o.i !== size)) {
          // Resize board if needed
          try {
            const newSize = window.a ? window.a.parse(size.toString()) : null;
            if (newSize) {
              window.v.rt(newSize);
              previousBoard = null; // Reset on resize
            }
          } catch(e) {
            console.error('Error resizing board:', e);
          }
        }

        try {
          if (isNewGame) {
            // New game - clear and rebuild from scratch
            console.log('New game detected, clearing board');
            window.v.clear();
            previousBoard = null;
          }

          // Find new moves by comparing with previous board
          const newMoves = [];
          
          if (!previousBoard || isNewGame) {
            // First time or new game - apply all moves from current board
            for (let i = 0; i < size; i++) {
              for (let j = 0; j < size; j++) {
                if (board[i] && board[i][j] && board[i][j] !== '.') {
                  const col = String.fromCharCode(97 + j); // a, b, c...
                  const row = (i + 1).toString();
                  const cellValue = board[i][j];
                  newMoves.push({
                    move: col + row,
                    cellValue: cellValue,
                    // 'x' is player 0 (black), 'o' is player 1 (white)
                    player: cellValue === 'x' ? window.u.P : window.u.R,
                    row: i,
                    col: j
                  });
                }
              }
            }
          } else {
            // Incremental update - find cells that changed from empty to occupied
            for (let i = 0; i < size; i++) {
              for (let j = 0; j < size; j++) {
                const prevCell = previousBoard[i] && previousBoard[i][j] ? previousBoard[i][j] : '.';
                const currCell = board[i] && board[i][j] ? board[i][j] : '.';
                
                // If cell changed from empty to occupied, it's a new move
                if (prevCell === '.' && currCell !== '.' && currCell !== prevCell) {
                  const col = String.fromCharCode(97 + j); // a, b, c...
                  const row = (i + 1).toString();
                  newMoves.push({
                    move: col + row,
                    cellValue: currCell,
                    // 'x' is player 0 (black), 'o' is player 1 (white)
                    player: currCell === 'x' ? window.u.P : window.u.R,
                    row: i,
                    col: j
                  });
                }
              }
            }
          }
          
          console.log(`Found ${newMoves.length} new move(s) to apply`);

          // Apply only the new moves
          newMoves.forEach((moveInfo) => {
            try {
              // Parse move using hexreplay's F.q function
              const move = window.F ? window.F.q(moveInfo.move) : null;
              if (move) {
                const moveObj = window.f ? new window.f(window.u.O) : null;
                if (moveObj) {
                  moveObj.O = move;
                  // Set the player for this move using 'xt' property
                  moveObj.xt = moveInfo.player;
                  console.log(`Applying move ${moveInfo.move} (${moveInfo.cellValue}) for player ${moveInfo.player === window.u.P ? 'black' : 'white'}`);
                  const success = window.v.$(moveObj);
                  if (!success) {
                    console.warn(`Failed to apply move ${moveInfo.move}`);
                  }
                } else {
                  console.warn('Could not create move object');
                }
              } else {
                console.warn('Could not parse move:', moveInfo.move);
              }
            } catch(e) {
              console.error('Error applying move:', moveInfo, e);
            }
          });
          
          // Update previous board state for next comparison
          previousBoard = board.map(row => [...row]); // Deep copy
          previousSize = size;
          
        } catch(e) {
          console.error('Error updating board:', e);
        }
      }
      
      function pollForUpdates() {
        fetch('http://localhost:8001/state')
          .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then(data => {
            console.log("data", data)
            if (data.last_update > lastUpdateId) {
              lastUpdateId = data.last_update;
              const nextMove = data.next_move || 'N/A';
              updateStatus(`Connected\nUpdated: ${new Date().toLocaleTimeString()}\nNext: ${nextMove}`, true);
              updateBoardFromState(data);
            } else {
              updateStatus(`Connected\nWaiting for updates...\n(last: ${lastUpdateId})`, true);
            }
          })
          .catch(error => {
            updateStatus(`Disconnected\n${error.message}`, false);
          });
      }
      
      // Start polling every 500ms
      function startPolling() {
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(pollForUpdates, 500);
        pollForUpdates(); // Immediate first poll
      }
      
      // Start polling when page loads
      window.addEventListener('load', function() {
        // Wait for hexreplay to initialize
        setTimeout(startPolling, 1000);
      });
    </script>
  </body>
</html>
